name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      # Te same testy co w release.yml — bez nich czerwony test wychodził
      # dopiero po merge'u, jako release, który po cichu się nie pojawiał.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Od v1.110.0 (PKG-3, ADR-005) dist/ to DOKŁADNIE dwa samodzielne
      # pliki: dashboard i edytory ładowane na żądanie. Trzeci plik (np. chunk
      # rollupa po dodaniu import() z literałem) nie może przejść
      # niezauważony — w releasie by go zabrakło, a chunk importujący kartę
      # bez ?hacstag= ewaluowałby ją drugi raz. Budżet rozmiaru pilnuje, żeby
      # edytory po cichu nie wróciły do pliku dashboardu (dziś ~339 KB).
      - name: Verify dist output
        run: |
          test -f dist/stratum-card.js
          test -f dist/stratum-card-editors.js
          extra=$(find dist -type f ! -name stratum-card.js ! -name stratum-card-editors.js)
          if [ -n "$extra" ]; then
            echo "Nieoczekiwane pliki w dist/: $extra"
            exit 1
          fi
          size=$(stat -c%s dist/stratum-card.js)
          echo "dist/stratum-card.js: $size B"
          if [ "$size" -gt 360000 ]; then
            echo "dist/stratum-card.js przekracza budżet 360000 B — czy edytory wróciły do dashboardu?"
            exit 1
          fi

  hacs:
    name: HACS metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
