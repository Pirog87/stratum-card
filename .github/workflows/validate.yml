name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      # Te same testy co w release.yml — bez nich czerwony test wychodził
      # dopiero po merge'u, jako release, który po cichu się nie pojawiał.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # HACS pobiera z releasu jeden plik JS — drugi chunk (np. po dodaniu
      # dynamicznego import() bez inlineDynamicImports) nie może przejść
      # niezauważony, bo w releasie by go zabrakło.
      - name: Verify single-file output
        run: |
          test -f dist/stratum-card.js
          extra=$(find dist -type f ! -name stratum-card.js)
          if [ -n "$extra" ]; then
            echo "Nieoczekiwane pliki w dist/: $extra"
            exit 1
          fi

  hacs:
    name: HACS metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
