name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auto-release from package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse --verify "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        if: steps.tag_check.outputs.exists == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.tag_check.outputs.exists == 'false'
        run: npm test

      - name: Build
        if: steps.tag_check.outputs.exists == 'false'
        run: npm run build

      - name: Package release assets (JS + grafiki scen)
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          # HACS (bez zip_release) pobiera KAŻDY asset releasu płasko do
          # www/community/stratum-card/ — więc assetami są dokładnie pliki,
          # które mają wylądować na dysku. Grafiki z prefiksem sceny-.
          mkdir -p build
          cp dist/stratum-card.js build/
          # Świeży .js.gz nadpisuje ewentualną pozostałość po starej
          # instalacji — HA potrafi serwować .gz zamiast .js, gdy istnieje.
          gzip -9 -c dist/stratum-card.js > build/stratum-card.js.gz
          for f in assets/sceny/*.webp; do
            cp "$f" "build/sceny-$(basename "$f")"
          done
          ls -la build/

      - name: Create tag and release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            build/stratum-card.js
            build/stratum-card.js.gz
            build/sceny-*.webp
          fail_on_unmatched_files: true
